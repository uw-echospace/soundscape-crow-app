name: Build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  hold:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Mark as pre-release while generating artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --prerelease

  build:
    needs: hold
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        os: [windows-latest, macos-26, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - run: npm ci
      - run: npm run build:analyzer
      - name: Use release tag as the app version
        if: github.event_name == 'release'
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          npm version --no-git-tag-version --allow-same-version "${tag#v}"
      - run: npm run dist -- --publish never
      - name: Update files in release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          gh release upload "${{ github.event.release.tag_name }}" --clobber \
            dist/*.dmg dist/*.exe dist/*.AppImage dist/*.blockmap dist/latest*.yml
      - uses: actions/upload-artifact@v4
        with:
          name: CROW-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/latest*.yml

  release:
    needs: build
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Full release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.event.release.tag_name }}" --repo "${{ github.repository }}" --prerelease=false --latest
